<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 680" font-family="'Helvetica Neue', Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0D0D1A"/>
      <stop offset="0.55" stop-color="#1A0A2E"/>
      <stop offset="1" stop-color="#0A1A1F"/>
    </linearGradient>
    <linearGradient id="sl" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7C4DFF"/>
      <stop offset="1" stop-color="#00BCD4"/>
    </linearGradient>
    <linearGradient id="rm" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2EA8FF"/>
      <stop offset="1" stop-color="#0B66E4"/>
    </linearGradient>
    <marker id="arw" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#9aa0b5"/>
    </marker>
  </defs>

  <rect width="1280" height="680" fill="url(#bg)"/>

  <!-- header -->
  <text x="640" y="62" text-anchor="middle" fill="#7FB2FF" font-size="20" letter-spacing="4" font-weight="700">ONE CLAUDE CODE SESSION · TWO SKILLS</text>
  <text x="640" y="108" text-anchor="middle" fill="#FFFFFF" font-size="40" font-weight="800">“Globalize this video into Spanish.”</text>
  <text x="640" y="142" text-anchor="middle" fill="#B9C0D4" font-size="20">You ask in plain English. Claude composes both skills. You never touch an API.</text>

  <!-- 1. source -->
  <g>
    <rect x="40" y="250" width="220" height="180" rx="20" fill="#16162a" stroke="#2b2b45" stroke-width="1.5"/>
    <text x="150" y="300" text-anchor="middle" font-size="46">🎬</text>
    <text x="150" y="346" text-anchor="middle" fill="#FFFFFF" font-size="22" font-weight="700">Your English</text>
    <text x="150" y="374" text-anchor="middle" fill="#FFFFFF" font-size="22" font-weight="700">video</text>
    <text x="150" y="408" text-anchor="middle" fill="#8b91a7" font-size="16">made with Remotion</text>
  </g>

  <!-- arrow 1 -->
  <line x1="266" y1="340" x2="338" y2="340" stroke="#9aa0b5" stroke-width="2.5" marker-end="url(#arw)"/>

  <!-- 2. SpeechLab skill -->
  <g>
    <rect x="344" y="222" width="300" height="236" rx="22" fill="#191033" stroke="url(#sl)" stroke-width="2.5"/>
    <rect x="344" y="222" width="300" height="46" rx="22" fill="url(#sl)"/>
    <rect x="344" y="246" width="300" height="22" fill="#191033"/>
    <text x="494" y="253" text-anchor="middle" fill="#0D0D1A" font-size="18" font-weight="800" letter-spacing="1">🎙️  SPEECHLAB SKILL</text>
    <text x="494" y="312" text-anchor="middle" fill="#FFFFFF" font-size="22" font-weight="700">Clones the voice</text>
    <text x="494" y="346" text-anchor="middle" fill="#FFFFFF" font-size="22" font-weight="700">Translates the script</text>
    <line x1="380" y1="372" x2="608" y2="372" stroke="#3a2f5c" stroke-width="1.2"/>
    <text x="494" y="402" text-anchor="middle" fill="#C9B8FF" font-size="16">knows es_la (not es), the JWT path,</text>
    <text x="494" y="426" text-anchor="middle" fill="#C9B8FF" font-size="16">how to poll the dub → so Claude gets it right</text>
  </g>

  <!-- handoff arrow with payload -->
  <line x1="650" y1="340" x2="722" y2="340" stroke="#9aa0b5" stroke-width="2.5" marker-end="url(#arw)"/>
  <text x="686" y="316" text-anchor="middle" fill="#8b91a7" font-size="13">dubbed voice +</text>
  <text x="686" y="332" text-anchor="middle" fill="#8b91a7" font-size="13">translated captions</text>

  <!-- 3. Remotion skill -->
  <g>
    <rect x="728" y="222" width="300" height="236" rx="22" fill="#0e1b30" stroke="url(#rm)" stroke-width="2.5"/>
    <rect x="728" y="222" width="300" height="46" rx="22" fill="url(#rm)"/>
    <rect x="728" y="246" width="300" height="22" fill="#0e1b30"/>
    <text x="878" y="253" text-anchor="middle" fill="#0D0D1A" font-size="18" font-weight="800" letter-spacing="1">🎬  REMOTION SKILL</text>
    <text x="878" y="312" text-anchor="middle" fill="#FFFFFF" font-size="22" font-weight="700">Swaps the audio track</text>
    <text x="878" y="346" text-anchor="middle" fill="#FFFFFF" font-size="22" font-weight="700">Slices in the subtitles</text>
    <line x1="764" y1="372" x2="992" y2="372" stroke="#1d3350" stroke-width="1.2"/>
    <text x="878" y="402" text-anchor="middle" fill="#A9D2FF" font-size="16">parametrizes the composition by language</text>
    <text x="878" y="426" text-anchor="middle" fill="#A9D2FF" font-size="16">and re-renders — same pixels, new language</text>
  </g>

  <!-- arrow 3 -->
  <line x1="1034" y1="340" x2="1106" y2="340" stroke="#9aa0b5" stroke-width="2.5" marker-end="url(#arw)"/>

  <!-- 4. outputs -->
  <g>
    <rect x="1112" y="250" width="128" height="180" rx="20" fill="#16162a" stroke="#2b2b45" stroke-width="1.5"/>
    <text x="1176" y="300" text-anchor="middle" font-size="34">🌍</text>
    <text x="1176" y="338" text-anchor="middle" fill="#FFFFFF" font-size="18" font-weight="700">es_la</text>
    <text x="1176" y="364" text-anchor="middle" fill="#FFFFFF" font-size="18" font-weight="700">fr · ja</text>
    <text x="1176" y="390" text-anchor="middle" fill="#FFFFFF" font-size="18" font-weight="700">ar_sa …</text>
    <text x="1176" y="416" text-anchor="middle" fill="#8b91a7" font-size="13">localized MP4s</text>
  </g>

  <!-- footer -->
  <text x="640" y="556" text-anchor="middle" fill="#FFFFFF" font-size="22" font-weight="700">SpeechLab handles the language. Remotion handles the video. Claude handles the conversation.</text>
  <text x="640" y="592" text-anchor="middle" fill="#8b91a7" font-size="17">A skill is just expertise Claude loads on demand — so two skills in one session compose with zero glue code.</text>
</svg>
